<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card — Back · Dr. Olinda Johnson, PhD</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    /* ===== Design tokens ===== */
    :root {
      --violet-900: #1E1438;
      --violet-700: #3F3185;
      --violet-600: #5E45A8;
      --violet-500: #7356B8;
      --violet-400: #9580CC;
      --violet-300: #BEB0E0;
      --violet-200: #D8D0EF;
      --violet-100: #EBE6F8;
      --violet-050: #F5F2FB;
      --silver-600: #8E929E;
      --silver-500: #A4A8B4;
      --silver-400: #BCC0CC;
      --silver-200: #D4D8E2;
      --silver-100: #E5E8EF;
      --ink:   #1E1A2C;
      --body:  #3C3848;
      --muted: #6A6678;
      --cream: #FDFCFF;
      --white: #FFFFFF;
      --serif: "Fraunces", Georgia, "Times New Roman", serif;
      --sans:  "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--silver-100);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    /* ===== The card ===== */
    .card {
      --card-w: 3.5in;
      --card-h: 2.0in;
      --base: 7pt;
      width: var(--card-w);
      height: var(--card-h);
      font-size: var(--base);
      position: relative;
      overflow: hidden;
      color: var(--violet-100);
      font-family: var(--sans);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      background:
        radial-gradient(ellipse at 18% 22%, rgba(149, 128, 204, 0.30), transparent 55%),
        radial-gradient(ellipse at 95% 110%, rgba(30, 20, 56, 0.45), transparent 55%),
        linear-gradient(135deg, var(--violet-700) 0%, var(--violet-900) 100%);
      padding: 2.0em 2.4em;
      display: grid;
      grid-template-columns: auto 1fr;
      grid-template-rows: auto 1fr auto;
      column-gap: 1.6em;
      row-gap: 0.9em;
      align-items: start;
    }

    /* Screen preview: 2× scale */
    @media screen {
      .card {
        --card-w: 7in;
        --card-h: 4in;
        --base: 14pt;
        border-radius: 0.06in;
        box-shadow:
          0 1px 0 var(--silver-200),
          0 30px 60px -28px rgba(30, 20, 56, 0.28),
          0 8px 18px -10px rgba(30, 20, 56, 0.12);
      }
    }

    /* Print: actual trim */
    @media print {
      @page { size: 3.5in 2in; margin: 0; }
      body { background: var(--white); padding: 0; min-height: 0; display: block; }
      .card { box-shadow: none; border-radius: 0; }
    }

    /* Monogram */
    .card__mark {
      grid-column: 1;
      grid-row: 1 / span 3;
      align-self: center;
      width: 5.4em; height: 5.4em;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .card__mark::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px dashed rgba(213, 208, 239, 0.45);
    }
    .card__mark::after {
      content: "";
      position: absolute;
      inset: 0.55em;
      border-radius: 50%;
      border: 1px solid rgba(213, 208, 239, 0.30);
    }
    .card__mark-text {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 2.6em;
      letter-spacing: -0.04em;
      color: var(--violet-100);
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    /* Top eyebrow */
    .card__back-eyebrow {
      grid-column: 2; grid-row: 1;
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.78em;
      letter-spacing: 0.10em;
      color: var(--violet-300);
      display: flex; align-items: center; gap: 0.7em;
      white-space: nowrap;
    }
    .card__back-eyebrow::before {
      content: "";
      width: 1.8em; height: 1px;
      background: rgba(213, 208, 239, 0.45);
      flex: 0 0 auto;
    }

    /* Contact stack */
    .card__contact {
      grid-column: 2; grid-row: 2;
      align-self: center;
      margin: 0;
    }
    .card__contact-line {
      font-family: var(--serif);
      font-weight: 400;
      font-size: 1.05em;
      color: var(--white);
      line-height: 1.45;
      margin: 0;
      letter-spacing: 0.005em;
    }
    .card__contact-line + .card__contact-line { margin-top: 0.18em; }

    /* Bottom rule + URL */
    .card__back-foot {
      grid-column: 2; grid-row: 3;
      display: flex; align-items: center; gap: 0.85em;
      padding-top: 0.7em;
      border-top: 1px solid rgba(213, 208, 239, 0.20);
    }
    .card__back-foot-tag {
      font-family: var(--serif);
      font-style: italic;
      font-size: 0.72em;
      color: var(--violet-300);
      letter-spacing: 0.08em;
    }
    .card__back-url {
      font-family: var(--sans);
      font-size: 0.78em;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--white);
      margin-left: auto;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="card" aria-label="Business card — back">
    <div class="card__mark" aria-hidden="true">
      <span class="card__mark-text">OJ</span>
    </div>

    <div class="card__back-eyebrow">Request a training</div>

    <div class="card__contact">
      <p class="card__contact-line">Booking@OlindaJohnsonSpeaks.com</p>
      <p class="card__contact-line">712&middot;443&middot;3491</p>
      <p class="card__contact-line">Houston, Texas</p>
    </div>

    <div class="card__back-foot">
      <span class="card__back-foot-tag">Texas Medical Center</span>
      <span class="card__back-url">OlindaJohnsonSpeaks.com</span>
    </div>
  </div>
</body>
</html>
